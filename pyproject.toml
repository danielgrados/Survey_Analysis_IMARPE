[project]
name = "survey-analysis-imarpe"
version = "0.2.0"
description = "Funciones de análisis de cruceros y evaluaciones (IMARPE)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "matplotlib", "scipy", "scikit-learn", "openpyxl"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["survey_analysis_imarpe*"]
